<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Faraon138</title>
    
    <!-- Librerías CDN para Visor EPUB exclusivamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e293b;
            --card-light: #ffffff;
            --header-bg: #0f172a;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --accent-gold: #f59e0b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            scroll-behavior: smooth;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* HEADER */
        .header {
            text-align: center;
            padding: 16px 20px;
            background-color: var(--header-bg);
            color: #ffffff;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            position: relative;
        }
        .header h1 {
            margin: 0 0 4px 0;
            font-size: 28px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header p { margin: 0; font-size: 13px; color: var(--text-sub); }

        /* ACCIONES RÁPIDAS HEADER */
        .header-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .action-btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .action-btn:hover { background-color: var(--accent-blue); transform: translateY(-1px); }

        /* PANEL DE ESTADÍSTICAS */
        .stats-panel {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stats-card {
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }
        .stats-card h4 { margin: 0 0 5px 0; font-size: 12px; color: var(--text-sub); text-transform: uppercase; }
        .stats-card div { font-size: 14px; font-weight: bold; color: var(--text-main); }

        /* CONTROLES / BUSCADOR / FILTROS */
        .controls-container {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .search-bar-wrap {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 10px;
        }
        .search-bar {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 25px;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .search-bar:focus { border-color: var(--accent-blue); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3); }

        .sort-select {
            padding: 0 15px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 25px;
            outline: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #475569; background-color: #334155; }
        .filter-btn.active { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #ffffff; }
        .filter-btn.active-status { background-color: var(--accent-gold); border-color: var(--accent-gold); color: #000; font-weight: bold; }

        /* GRID DETALLE (2 COLUMNAS) */
        .library-grid-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* GRID MOSAICO (ESTANTERÍA DE PORTADAS) */
        .library-grid-mosaic {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        /* TARJETA DETALLE */
        .book-card {
            background: var(--card-light);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 18px;
            display: flex;
            gap: 18px;
            position: relative;
            box-sizing: border-box;
            transition: transform 0.2s, box-shadow 0.2s;
            color: #333;
        }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4); }

        .cover-container {
            position: relative;
            width: 120px;
            height: 175px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-cover { width: 100%; height: 100%; object-fit: cover; }

        /* PORTADA GENERADA PLACEHOLDER */
        .placeholder-cover {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
        }
        .placeholder-title { font-size: 13px; font-weight: bold; line-height: 1.2; overflow: hidden; max-height: 70px; }
        .placeholder-initials { font-size: 28px; font-weight: 900; opacity: 0.3; letter-spacing: 2px; }
        .placeholder-author { font-size: 10px; opacity: 0.9; text-transform: uppercase; }

        .book-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .book-title { margin: 0; color: #0f172a; font-size: 17px; font-weight: bold; line-height: 1.3; overflow-wrap: break-word; flex: 1; }
        .book-counter { font-size: 11px; color: #64748b; font-weight: 700; background: #f1f5f9; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }

        .book-author { margin: 0 0 6px 0; color: #d97706; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block; }
        .book-author:hover { text-decoration: underline; color: #b45309; }

        .book-meta { margin: 0 0 8px 0; font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .format-badge { color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .badge-epub { background-color: #16a34a; }
        .badge-pdf { background-color: #dc2626; }
        .badge-mobi { background-color: #0284c7; }
        .badge-cbr { background-color: #9333ea; }

        .book-review { margin: 0 0 12px 0; color: #334155; font-size: 13px; line-height: 1.45; text-align: justify; max-height: 80px; overflow-y: auto; }

        /* CONTROLES INFERIORES TARJETA */
        .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .btn-group { display: flex; gap: 6px; }

        .read-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }
        .read-btn:hover { background-color: var(--accent-hover); }

        .drive-icon-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 7px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .drive-icon-btn:hover { background-color: #e2e8f0; color: #0f172a; }

        .status-select {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }
        .fav-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #cbd5e1;
            transition: transform 0.2s, color 0.2s;
            padding: 0 4px;
        }
        .fav-btn.is-fav { color: var(--accent-gold); transform: scale(1.15); }

        /* TARJETA MOSAICO */
        .mosaic-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            aspect-ratio: 1 / 1.5;
            display: flex;
            flex-direction: column;
        }
        .mosaic-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .mosaic-card .cover-container { width: 100%; height: 100%; border-radius: 0; }
        .mosaic-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.4) 60%, transparent 100%);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            box-sizing: border-box;
            color: white;
        }
        .mosaic-card:hover .mosaic-overlay { opacity: 1; }
        .mosaic-title { font-size: 12px; font-weight: bold; line-height: 1.2; margin-bottom: 4px; }
        .mosaic-author { font-size: 10px; color: var(--accent-gold); }

        /* PAGINACIÓN */
        .pagination-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 35px 0;
        }
        .page-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .page-btn:hover { background-color: var(--accent-hover); }
        .page-btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; box-shadow: none; }
        .page-info {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            background-color: var(--header-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* MODALES */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }

        .reader-modal-content {
            background: #0f172a;
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .reader-header {
            padding: 12px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .reader-title { font-size: 15px; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .close-btn { background: #dc2626; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .reader-body { flex: 1; position: relative; background: #ffffff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #epub-viewer { width: 100%; height: 100%; background: #ffffff; }

        .reader-footer {
            padding: 10px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .random-modal-content {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--header-bg);
            color: white;
            border: 1px solid var(--border-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .library-grid-detail { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .book-card { flex-direction: column; align-items: center; text-align: center; }
            .book-title { padding-right: 0; }
            .search-bar-wrap { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1>★ Biblioteca de Faraon138 ★</h1>
        <p id="catalog-status">Conectando con Google Drive...</p>
        
        <div class="header-actions">
            <button class="action-btn" onclick="forceReSync()">🔄 Recargar</button>
            <button class="action-btn" onclick="openRandomBook()">🎲 Sorpréndeme</button>
            <button class="action-btn" onclick="toggleStatsPanel()">📊 Estadísticas</button>
            <button class="action-btn" onclick="toggleViewMode()" id="view-mode-btn">🧩 Vista Mosaico</button>
        </div>
    </div>

    <!-- PANEL DE ESTADÍSTICAS -->
    <div id="statsPanel" class="stats-panel">
        <div class="stats-card">
            <h4>Total Catálogo</h4>
            <div id="stat-total">0 libros</div>
        </div>
        <div class="stats-card">
            <h4>Formatos</h4>
            <div id="stat-formats">-</div>
        </div>
        <div class="stats-card">
            <h4>Top Autores</h4>
            <div id="stat-authors" style="font-size: 12px; font-weight: normal; line-height: 1.3;">-</div>
        </div>
    </div>

    <!-- CONTROLES DE BÚSQUEDA Y FILTROS -->
    <div class="controls-container">
        <div class="search-bar-wrap">
            <input type="text" id="searchBar" class="search-bar" placeholder="Buscar por título, autor o género..." onkeyup="triggerSearch()">
            <select id="sortSelect" class="sort-select" onchange="triggerSort()">
                <option value="recent">Más recientes primero</option>
                <option value="title_asc">Título (A-Z)</option>
                <option value="title_desc">Título (Z-A)</option>
                <option value="author_asc">Autor (A-Z)</option>
                <option value="author_desc">Autor (Z-A)</option>
                <option value="format">Por Formato</option>
            </select>
        </div>
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="setFormatFilter('ALL')">Todos</button>
            <button class="filter-btn" onclick="setFormatFilter('EPUB')">EPUB</button>
            <button class="filter-btn" onclick="setFormatFilter('PDF')">PDF</button>
            <button class="filter-btn" onclick="setFormatFilter('MOBI')">MOBI</button>
            <button class="filter-btn" onclick="setFormatFilter('CBR/CBZ')">CBR/CBZ</button>
            <span>|</span>
            <button class="filter-btn" id="filter-favs" onclick="setStatusFilter('FAV')">★ Favoritos</button>
            <button class="filter-btn" id="filter-reading" onclick="setStatusFilter('leyendo')">📖 Leyendo</button>
            <button class="filter-btn" id="filter-read" onclick="setStatusFilter('leido')">✔ Leídos</button>
            <button class="filter-btn" id="filter-pending" onclick="setStatusFilter('pendiente')">⏳ Pendientes</button>
        </div>
    </div>

    <!-- CONTENEDOR DE LA LIBRERÍA -->
    <div id="library" class="library-grid-detail"></div>

    <!-- PAGINACIÓN -->
    <div id="pagination" class="pagination-container"></div>
</div>

<!-- MODAL VISOR DE LIBROS (EPUB JS) -->
<div id="readerModal" class="modal-overlay">
    <div class="reader-modal-content">
        <div class="reader-header">
            <div class="reader-title" id="reader-book-title">Leyendo...</div>
            <button class="close-btn" onclick="closeReader()">✕ Cerrar Lector</button>
        </div>
        <div class="reader-body">
            <div id="epub-viewer" style="display:none;"></div>
            <div id="reader-loading" style="color:#0f172a; font-size:15px; font-weight:bold; text-align:center; padding:20px;">Cargando e-book digital...</div>
        </div>
        <div class="reader-footer">
            <button class="action-btn" id="epub-prev" onclick="epubRendition?.prev()" style="display:none;">← Capítulo Anterior</button>
            <span style="font-size:11px; color:#94a3b8;">Visor EPUB Integrado (Usa flechas ← → del teclado)</span>
            <button class="action-btn" id="epub-next" onclick="epubRendition?.next()" style="display:none;">Siguiente Capítulo →</button>
        </div>
    </div>
</div>

<!-- MODAL SORPRÉNDEME -->
<div id="randomModal" class="modal-overlay">
    <div class="random-modal-content">
        <h3 style="color:var(--accent-gold); margin-top:0;">🎲 ¡Tu lectura recomendada!</h3>
        <div id="random-card-body"></div>
        <div style="margin-top: 20px; display:flex; gap:10px; justify-content:center;">
            <button class="action-btn" onclick="openRandomBook()">🎲 Probar con otro</button>
            <button class="close-btn" onclick="closeRandomModal()">Cerrar</button>
        </div>
    </div>
</div>

<button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>

<script>
    const API_KEY = 'AIzaSyABYJpop2BBwvK0cPpdXv-Mge3Wc_SanwQ'; 
    const FOLDER_ID = '1DXoxedW-epDoOGaHFHyCEno2G7OdCGmh';
    const CACHE_KEY = 'faraon138_library_cache_v6';
    const USER_DATA_KEY = 'faraon138_user_preferences_v6';

    let globalBooks = [];       
    let userData = { favorites: {}, status: {} }; 
    let currentPage = 1;
    const itemsPerPage = 50;    
    let currentFormatFilter = 'ALL';
    let currentStatusFilter = 'ALL';
    let currentSort = 'recent';
    let currentViewMode = 'detail'; 
    let searchQuery = '';

    let renderTimeout = null;
    let firstRenderDone = false;
    let epubRendition = null;

    function normalizeText(text) {
        return (text || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function stringToColor(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        const c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
        return "#" + "000000".substring(0, 6 - c.length) + c;
    }

    function createPlaceholderCoverHTML(title, author) {
        const bg1 = stringToColor(author || "Anon");
        const bg2 = "#0f172a";
        const initials = title.split(' ').map(w => w[0]).join('').substring(0, 4).toUpperCase();
        return `
            <div class="placeholder-cover" style="background: linear-gradient(135deg, ${bg1}, ${bg2});">
                <div class="placeholder-author">${author || 'Autor Desconocido'}</div>
                <div class="placeholder-initials">${initials}</div>
                <div class="placeholder-title">${title}</div>
            </div>
        `;
    }

    function loadUserData() {
        const stored = localStorage.getItem(USER_DATA_KEY);
        if (stored) userData = JSON.parse(stored);
    }

    function saveUserData() {
        localStorage.setItem(USER_DATA_KEY, JSON.stringify(userData));
    }

    async function initLibrary() {
        loadUserData();
        const cached = localStorage.getItem(CACHE_KEY);
        
        if (cached) {
            globalBooks = JSON.parse(cached);
            document.getElementById('catalog-status').innerText = `Catálogo cargado desde memoria (${globalBooks.length} libros)`;
            firstRenderDone = true;
            updateStats();
            filterAndRender(false);
        } else {
            await fetchCalibreLibraryFromDrive();
        }
    }

    async function forceReSync() {
        localStorage.removeItem(CACHE_KEY);
        globalBooks = [];
        firstRenderDone = false;
        document.getElementById('catalog-status').innerText = "Sincronizando con Google Drive...";
        await fetchCalibreLibraryFromDrive();
    }

    async function fetchCalibreLibraryFromDrive() {
        const statusPara = document.getElementById('catalog-status');
        
        try {
            let allAuthors = [];
            let authorsPageToken = '';
            
            do {
                const authorsUrl = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+explicitlyTrashed=false&key=${API_KEY}&fields=nextPageToken,files(id,name)&pageSize=1000${authorsPageToken ? `&pageToken=${authorsPageToken}` : ''}`;
                const authorsResponse = await fetch(authorsUrl);
                const authorsData = await authorsResponse.json();
                
                if (authorsData.files) allAuthors = allAuthors.concat(authorsData.files);
                authorsPageToken = authorsData.nextPageToken;
            } while (authorsPageToken);
            
            for (const authorFolder of allAuthors) {
                let booksPageToken = '';
                do {
                    const booksUrl = `https://www.googleapis.com/drive/v3/files?q='${authorFolder.id}'+in+parents+and+mimeType='application/vnd.google-apps.folder'+and+explicitlyTrashed=false&key=${API_KEY}&fields=nextPageToken,files(id,name,createdTime)&pageSize=1000${booksPageToken ? `&pageToken=${booksPageToken}` : ''}`;
                    const booksResponse = await fetch(booksUrl);
                    const booksData = await booksResponse.json();
                    
                    if (booksData.files) {
                        booksData.files.forEach(bookFolder => {
                            let bookTitle = bookFolder.name.replace(/\s*\(\d+\)\s*$/, '').trim();
                            let addedTime = bookFolder.createdTime ? new Date(bookFolder.createdTime).getTime() : 0;

                            globalBooks.push({
                                folderId: bookFolder.id,
                                folderName: bookFolder.name,
                                title: bookTitle,
                                author: authorFolder.name,
                                createdTime: addedTime,
                                webViewLink: bookFolder.webViewLink,
                                loadedDetails: false,
                                formats: ['EPUB'] 
                            });
                        });

                        statusPara.innerText = `Descubriendo libros... (${globalBooks.length} detectados)`;

                        if (!firstRenderDone && globalBooks.length > 0) {
                            firstRenderDone = true;
                            filterAndRender(false);
                        } else {
                            requestThrottledRender();
                        }
                    }
                    booksPageToken = booksData.nextPageToken;
                } while (booksPageToken);
            }

            statusPara.innerText = `Catálogo completo sincronizado (${globalBooks.length} libros disponibles)`;
            localStorage.setItem(CACHE_KEY, JSON.stringify(globalBooks));
            updateStats();
            filterAndRender(false);

        } catch (error) {
            console.error(error);
            statusPara.innerText = "Error parcial cargando datos de la nube.";
        }
    }

    function requestThrottledRender() {
        if (renderTimeout) return;
        renderTimeout = setTimeout(() => {
            filterAndRender(true);
            renderTimeout = null;
        }, 1200);
    }

    function updateStats() {
        document.getElementById('stat-total').innerText = `${globalBooks.length} volúmenes`;
        
        let counts = { EPUB: 0, PDF: 0, MOBI: 0, Otros: 0 };
        let authorMap = {};

        globalBooks.forEach(b => {
            let fmt = (b.formats && b.formats[0]) ? b.formats[0].toUpperCase() : 'EPUB';
            if (counts[fmt] !== undefined) counts[fmt]++;
            else counts.Otros++;
            authorMap[b.author] = (authorMap[b.author] || 0) + 1;
        });

        document.getElementById('stat-formats').innerText = `${counts.EPUB} EPUB · ${counts.PDF} PDF · ${counts.MOBI} MOBI`;

        let topAuthors = Object.entries(authorMap)
            .sort((a,b) => b[1] - a[1])
            .slice(0, 5)
            .map(([name, count]) => `• ${name} (${count})`)
            .join('<br>');

        document.getElementById('stat-authors').innerHTML = topAuthors || '-';
    }

    function toggleStatsPanel() {
        const panel = document.getElementById('statsPanel');
        panel.style.display = panel.style.display === 'grid' ? 'none' : 'grid';
    }

    function filterAndRender(isBackground = false) {
        const libraryContainer = document.getElementById('library');
        const cleanQuery = normalizeText(searchQuery).trim();
        const keywords = cleanQuery ? cleanQuery.split(/\s+/).filter(k => k.length > 0) : [];

        let sorted = [...globalBooks];
        sorted.sort((a, b) => {
            if (currentSort === 'recent') return b.createdTime - a.createdTime;
            if (currentSort === 'title_asc') return a.title.localeCompare(b.title);
            if (currentSort === 'title_desc') return b.title.localeCompare(a.title);
            if (currentSort === 'author_asc') return a.author.localeCompare(b.author);
            if (currentSort === 'author_desc') return b.author.localeCompare(a.author);
            if (currentSort === 'format') return (a.formats[0]||'').localeCompare(b.formats[0]||'');
            return 0;
        });

        let filtered = sorted.filter(book => {
            if (currentFormatFilter !== 'ALL' && book.loadedDetails) {
                if (!book.formats.includes(currentFormatFilter)) return false;
            }
            if (currentStatusFilter === 'FAV' && !userData.favorites[book.folderId]) return false;
            if (['leyendo', 'leido', 'pendiente'].includes(currentStatusFilter)) {
                if (userData.status[book.folderId] !== currentStatusFilter) return false;
            }
            if (keywords.length > 0) {
                const combinedText = normalizeText(`${book.title} ${book.author} ${book.folderName}`);
                return keywords.every(keyword => combinedText.includes(keyword));
            }
            return true;
        });

        const totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const pageItems = filtered.slice(startIndex, startIndex + itemsPerPage);

        const currentDisplayedCards = libraryContainer.querySelectorAll('.book-card, .mosaic-card').length;
        if (isBackground && currentDisplayedCards === pageItems.length) {
            renderPaginationControls(filtered.length);
            updateStats();
            return;
        }

        libraryContainer.className = currentViewMode === 'detail' ? 'library-grid-detail' : 'library-grid-mosaic';
        libraryContainer.innerHTML = '';

        if (filtered.length === 0) {
            libraryContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">No se encontraron libros.</div>`;
            renderPaginationControls(0);
            return;
        }

        pageItems.forEach((book, index) => {
            const absoluteNumber = startIndex + index + 1;
            const isFav = !!userData.favorites[book.folderId];
            const currentStat = userData.status[book.folderId] || 'pendiente';

            if (currentViewMode === 'detail') {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.id = `card-${book.folderId}`;
                
                let coverHTML = book.coverId 
                    ? `<img class="book-cover" src="https://drive.google.com/thumbnail?id=${book.coverId}&sz=w500" alt="Portada">`
                    : createPlaceholderCoverHTML(book.title, book.author);

                let badgesHtml = (book.formats || ['EPUB']).map(fmt => {
                    let cls = fmt.toLowerCase().includes('pdf') ? 'badge-pdf' : fmt.toLowerCase().includes('mobi') ? 'badge-mobi' : fmt.toLowerCase().includes('cbr') ? 'badge-cbr' : 'badge-epub';
                    return `<span class="format-badge ${cls}">${fmt}</span>`;
                }).join('');

                card.innerHTML = `
                    <div class="cover-container" id="cover-zone-${book.folderId}">${coverHTML}</div>
                    <div class="book-info">
                        <div>
                            <div class="title-header">
                                <h2 class="book-title" id="title-${book.folderId}">${book.title}</h2>
                                <div class="book-counter">#${absoluteNumber}</div>
                            </div>
                            <p class="book-author" id="author-${book.folderId}" onclick="filterByAuthor('${book.author.replace(/'/g, "\\'")}')">${book.author}</p>
                            <div class="book-meta">
                                <span id="formats-zone-${book.folderId}">${badgesHtml}</span>
                            </div>
                            <div class="book-review" id="review-${book.folderId}">${book.review || 'Buscando sinopsis en la nube...'}</div>
                        </div>
                        <div class="card-actions">
                            <div class="btn-group">
                                <button class="read-btn" onclick="openReader('${book.folderId}')">📖 Leer</button>
                                <a href="${book.bookLink || book.webViewLink}" id="link-${book.folderId}" class="drive-icon-btn" target="_blank" title="Abrir en Google Drive">📂 Drive</a>
                            </div>
                            <div style="display:flex; align-items:center; gap:6px;">
                                <select class="status-select" onchange="changeBookStatus('${book.folderId}', this.value)">
                                    <option value="pendiente" ${currentStat==='pendiente'?'selected':''}>⏳ Pendiente</option>
                                    <option value="leyendo" ${currentStat==='leyendo'?'selected':''}>📖 Leyendo</option>
                                    <option value="leido" ${currentStat==='leido'?'selected':''}>✔ Leído</option>
                                </select>
                                <button class="fav-btn ${isFav?'is-fav':''}" onclick="toggleFavorite('${book.folderId}')">★</button>
                            </div>
                        </div>
                    </div>
                `;
                libraryContainer.appendChild(card);
            } else {
                const card = document.createElement('div');
                card.className = 'mosaic-card';
                card.onclick = () => openReader(book.folderId);

                let coverHTML = book.coverId 
                    ? `<img class="book-cover" src="https://drive.google.com/thumbnail?id=${book.coverId}&sz=w500" alt="Portada">`
                    : createPlaceholderCoverHTML(book.title, book.author);

                card.innerHTML = `
                    <div class="cover-container" id="cover-zone-${book.folderId}">${coverHTML}</div>
                    <div class="mosaic-overlay">
                        <div class="mosaic-title" id="title-${book.folderId}">${book.title}</div>
                        <div class="mosaic-author" id="author-${book.folderId}">${book.author}</div>
                    </div>
                `;
                libraryContainer.appendChild(card);
            }

            if (!book.loadedDetails) {
                fetchBookDeepDetails(book);
            }
        });

        renderPaginationControls(filtered.length);
        updateStats();
    }

    async function fetchBookDeepDetails(book) {
        try {
            const filesUrl = `https://www.googleapis.com/drive/v3/files?q='${book.folderId}'+in+parents+and+explicitlyTrashed=false&key=${API_KEY}&fields=files(id,name,webViewLink)&pageSize=100`;
            const filesResponse = await fetch(filesUrl);
            const filesData = await filesResponse.json();

            let metadataId = '';
            let coverId = '';
            let fileToReadId = '';
            let bookLink = book.webViewLink; 
            let detectedFormats = [];

            if (filesData.files) {
                filesData.files.forEach(file => {
                    const nameLower = file.name.toLowerCase();
                    if (nameLower === 'metadata.opf') metadataId = file.id;
                    else if (nameLower.includes('cover.')) coverId = file.id;
                    
                    if (nameLower.endsWith('.epub')) { detectedFormats.push('EPUB'); fileToReadId = file.id; bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.pdf')) { detectedFormats.push('PDF'); bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.mobi')) { detectedFormats.push('MOBI'); if(!fileToReadId) fileToReadId = file.id; bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.cbr') || nameLower.endsWith('.cbz')) { detectedFormats.push('CBR/CBZ'); bookLink = file.webViewLink; }
                });
            }

            book.coverId = coverId;
            book.fileToReadId = fileToReadId;
            book.bookLink = bookLink;
            if (detectedFormats.length > 0) book.formats = detectedFormats;
            book.loadedDetails = true;

            const coverZone = document.getElementById(`cover-zone-${book.folderId}`);
            if (coverZone && coverId) {
                coverZone.innerHTML = `<img class="book-cover" src="https://drive.google.com/thumbnail?id=${coverId}&sz=w500" alt="Portada">`;
            }
            const formatsZone = document.getElementById(`formats-zone-${book.folderId}`);
            if (formatsZone) {
                let badgesHtml = book.formats.map(fmt => {
                    let cls = fmt.toLowerCase().includes('pdf') ? 'badge-pdf' : fmt.toLowerCase().includes('mobi') ? 'badge-mobi' : fmt.toLowerCase().includes('cbr') ? 'badge-cbr' : 'badge-epub';
                    return `<span class="format-badge ${cls}">${fmt}</span>`;
                }).join('');
                formatsZone.innerHTML = badgesHtml;
            }
            const linkEl = document.getElementById(`link-${book.folderId}`);
            if (linkEl) linkEl.setAttribute('href', bookLink);

            if (metadataId) {
                const googleUrl = `https://www.googleapis.com/drive/v3/files/${metadataId}?alt=media&key=${API_KEY}`;
                let xmlText = null;
                const proxies = [
                    `https://api.allorigins.win/raw?url=${encodeURIComponent(googleUrl)}`,
                    `https://corsproxy.io/?${encodeURIComponent(googleUrl)}`
                ];

                for (let proxy of proxies) {
                    try {
                        let res = await fetch(proxy);
                        if (res.ok) {
                            xmlText = await res.text();
                            if (xmlText && xmlText.includes('<')) break;
                        }
                    } catch(e) {}
                }

                if (xmlText) {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    
                    const titleNode = xmlDoc.getElementsByTagName("dc:title")[0] || xmlDoc.getElementsByTagName("title")[0];
                    const creatorNode = xmlDoc.getElementsByTagName("dc:creator")[0] || xmlDoc.getElementsByTagName("creator")[0];
                    const descNode = xmlDoc.getElementsByTagName("dc:description")[0] || xmlDoc.getElementsByTagName("description")[0];

                    if (titleNode?.textContent) {
                        book.title = titleNode.textContent.trim();
                        const tEl = document.getElementById(`title-${book.folderId}`);
                        if (tEl) tEl.innerText = book.title;
                    }
                    if (creatorNode?.textContent) {
                        book.author = creatorNode.textContent.trim();
                        const aEl = document.getElementById(`author-${book.folderId}`);
                        if (aEl) aEl.innerText = book.author;
                    }
                    if (descNode?.textContent) {
                        book.review = descNode.textContent.trim();
                        const rEl = document.getElementById(`review-${book.folderId}`);
                        if (rEl) rEl.innerHTML = book.review;
                    }
                }
            }

            localStorage.setItem(CACHE_KEY, JSON.stringify(globalBooks));

        } catch (err) {}
    }

    // MANEJO DEL LECTOR: DESCARGA DIRECTA DE LA API DE GOOGLE DRIVE SIN PROXIES QUE CORROMPAN EL BINARIO
    async function openReader(folderId) {
        const book = globalBooks.find(b => b.folderId === folderId);
        if (!book) return;

        // SI ES PDF: ABRIR EN VISOR NATIVO DE GOOGLE DRIVE EN PESTAÑA NUEVA
        if (book.formats && book.formats.some(f => f.toUpperCase().includes('PDF'))) {
            window.open(book.bookLink || book.webViewLink, '_blank');
            return;
        }

        const modal = document.getElementById('readerModal');
        const titleEl = document.getElementById('reader-book-title');
        const loadingEl = document.getElementById('reader-loading');
        const epubViewer = document.getElementById('epub-viewer');

        titleEl.innerText = `Leyendo: ${book.title}`;
        modal.classList.add('active');
        loadingEl.style.display = 'block';
        loadingEl.innerHTML = "Descargando e-book y preparando visor...";
        epubViewer.style.display = 'none';

        document.getElementById('epub-prev').style.display = 'none';
        document.getElementById('epub-next').style.display = 'none';

        if (!book.fileToReadId) {
            loadingEl.innerHTML = `No se detectó un archivo legible directo.<br><br><a href="${book.bookLink || book.webViewLink}" target="_blank" class="read-btn">📂 Abrir en Google Drive</a>`;
            return;
        }

        try {
            // DESCARGA DIRECTA BINARIA DESDE GOOGLE DRIVE
            const directUrl = `https://www.googleapis.com/drive/v3/files/${book.fileToReadId}?alt=media&key=${API_KEY}`;
            const response = await fetch(directUrl);
            
            if (!response.ok) throw new Error("Error en la respuesta de Drive API");
            
            const arrayBuffer = await response.arrayBuffer();

            loadingEl.style.display = 'none';
            epubViewer.style.display = 'block';
            document.getElementById('epub-prev').style.display = 'inline-block';
            document.getElementById('epub-next').style.display = 'inline-block';

            if (epubRendition) {
                try { epubRendition.destroy(); } catch(e){}
            }
            epubViewer.innerHTML = '';

            const ePubBook = ePub(arrayBuffer);
            epubRendition = ePubBook.renderTo("epub-viewer", { width: "100%", height: "100%" });
            await epubRendition.display();

        } catch (e) {
            console.error("Error abriendo EPUB:", e);
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = `No se pudo desplegar el visor interno de este e-book.<br><br><a href="${book.bookLink || book.webViewLink}" target="_blank" class="read-btn" style="text-decoration:none;">📂 Abrir directamente en Google Drive</a>`;
        }
    }

    function closeReader() {
        document.getElementById('readerModal').classList.remove('active');
        if (epubRendition) {
            try { epubRendition.destroy(); } catch(e){}
        }
    }

    document.addEventListener('keydown', function(e) {
        const modal = document.getElementById('readerModal');
        if (modal.classList.contains('active') && epubRendition) {
            if (e.key === 'ArrowRight') epubRendition.next();
            if (e.key === 'ArrowLeft') epubRendition.prev();
            if (e.key === 'Escape') closeReader();
        }
    });

    function openRandomBook() {
        if (globalBooks.length === 0) return;
        const randomBook = globalBooks[Math.floor(Math.random() * globalBooks.length)];
        
        const modal = document.getElementById('randomModal');
        const body = document.getElementById('random-card-body');

        body.innerHTML = `
            <div style="font-size:18px; font-weight:bold; color:white; margin-bottom:6px;">${randomBook.title}</div>
            <div style="color:var(--accent-gold); font-size:14px; margin-bottom:12px;">${randomBook.author}</div>
            <button class="read-btn" style="margin: 0 auto;" onclick="closeRandomModal(); openReader('${randomBook.folderId}');">📖 Leer este libro ahora</button>
        `;
        modal.classList.add('active');
    }

    function closeRandomModal() {
        document.getElementById('randomModal').classList.remove('active');
    }

    function toggleFavorite(id) {
        userData.favorites[id] = !userData.favorites[id];
        saveUserData();
        filterAndRender(false);
    }

    function changeBookStatus(id, newStatus) {
        userData.status[id] = newStatus;
        saveUserData();
    }

    function filterByAuthor(authorName) {
        document.getElementById('searchBar').value = authorName;
        searchQuery = authorName;
        currentPage = 1;
        filterAndRender(false);
    }

    function setFormatFilter(fmt) {
        currentFormatFilter = fmt;
        document.querySelectorAll('.filter-container .filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        currentPage = 1;
        filterAndRender(false);
    }

    function setStatusFilter(status) {
        currentStatusFilter = currentStatusFilter === status ? 'ALL' : status;
        document.querySelectorAll('.filter-container .filter-btn').forEach(b => b.classList.remove('active-status'));
        if (currentStatusFilter !== 'ALL') event.target.classList.add('active-status');
        currentPage = 1;
        filterAndRender(false);
    }

    function toggleViewMode() {
        currentViewMode = currentViewMode === 'detail' ? 'mosaic' : 'detail';
        document.getElementById('view-mode-btn').innerText = currentViewMode === 'detail' ? '🧩 Vista Mosaico' : '📋 Vista Detalle';
        filterAndRender(false);
    }

    function triggerSearch() {
        searchQuery = document.getElementById('searchBar').value;
        currentPage = 1;
        filterAndRender(false);
    }

    function triggerSort() {
        currentSort = document.getElementById('sortSelect').value;
        filterAndRender(false);
    }

    function renderPaginationControls(totalItems) {
        const pagContainer = document.getElementById('pagination');
        const totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
        
        if (totalPages <= 1) { pagContainer.innerHTML = ''; return; }

        pagContainer.innerHTML = `
            <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(-1)">← Anteriores 50</button>
            <span class="page-info">Página ${currentPage} de ${totalPages}</span>
            <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(1)">Siguientes 50 →</button>
        `;
    }

    function changePage(dir) {
        currentPage += dir;
        window.scrollTo({top: 0, behavior: 'smooth'});
        filterAndRender(false);
    }

    window.onscroll = function() {
        const btn = document.getElementById("backToTop");
        btn.style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? "block" : "none";
    };

    function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

    initLibrary();
</script>
