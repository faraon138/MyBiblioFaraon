<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biblioteca de Faraon138</title>
    
    <!-- Librerías CDN para Visor EPUB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e293b;
            --card-light: #ffffff;
            --header-bg: #0f172a;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --accent-gold: #f59e0b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 1200px; margin: 0 auto; display: none; }

        /* PANTALLA DE BLOQUEO / LOGIN */
        #login-overlay {
            position: fixed;
            inset: 0;
            background: #090d16;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 25px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .login-card h2 { margin: 0 0 8px 0; color: #ffffff; font-size: 20px; }
        .login-card p { margin: 0 0 20px 0; color: var(--text-sub); font-size: 13px; }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            border: 2px solid var(--border-color);
            background: #1e293b;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            font-size: 16px; /* Evita zoom automático en Safari */
            -webkit-appearance: none;
        }
        .login-input:focus { border-color: var(--accent-blue); }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-appearance: none;
        }
        .login-btn:hover { background: var(--accent-hover); }
        .login-error { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

        /* HEADER */
        .header {
            text-align: center;
            padding: 16px 20px;
            background-color: var(--header-bg);
            color: #ffffff;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            position: relative;
        }
        .header h1 { margin: 0 0 4px 0; font-size: 26px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }
        .header p { margin: 0; font-size: 13px; color: var(--text-sub); }

        .header-actions { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .action-btn {
            background-color: #334155;
            color: #fff;
            border: none;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            -webkit-appearance: none;
        }
        .action-btn:hover { background-color: var(--accent-blue); }

        .stats-panel {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stats-card {
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }
        .stats-card h4 { margin: 0 0 5px 0; font-size: 12px; color: var(--text-sub); text-transform: uppercase; }
        .stats-card div { font-size: 14px; font-weight: bold; color: var(--text-main); }

        .controls-container { margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .search-bar-wrap { width: 100%; max-width: 650px; display: flex; gap: 10px; }
        .search-bar {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 25px;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            -webkit-appearance: none;
        }
        .search-bar:focus { border-color: var(--accent-blue); }

        .sort-select {
            padding: 0 15px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: #ffffff;
            border-radius: 25px;
            outline: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
        }

        .filter-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            color: #cbd5e1;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .filter-btn:hover { border-color: #475569; background-color: #334155; }
        .filter-btn.active { background-color: var(--accent-blue); border-color: var(--accent-blue); color: #ffffff; }
        .filter-btn.active-status { background-color: var(--accent-gold); border-color: var(--accent-gold); color: #000; font-weight: bold; }

        .library-grid-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .library-grid-mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }

        .book-card {
            background: var(--card-light);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 18px;
            display: flex;
            gap: 18px;
            position: relative;
            box-sizing: border-box;
            color: #333;
        }

        .cover-container {
            position: relative;
            width: 120px;
            height: 175px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-cover { width: 100%; height: 100%; object-fit: cover; }

        .placeholder-cover {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
        }
        .placeholder-title { font-size: 13px; font-weight: bold; line-height: 1.2; overflow: hidden; max-height: 70px; }
        .placeholder-initials { font-size: 28px; font-weight: 900; opacity: 0.3; letter-spacing: 2px; }
        .placeholder-author { font-size: 10px; opacity: 0.9; text-transform: uppercase; }

        .book-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .title-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .book-title { margin: 0; color: #0f172a; font-size: 17px; font-weight: bold; line-height: 1.3; overflow-wrap: break-word; flex: 1; }
        .book-counter { font-size: 11px; color: #64748b; font-weight: 700; background: #f1f5f9; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }

        .book-author { margin: 0 0 6px 0; color: #d97706; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block; }
        .book-author:hover { text-decoration: underline; }

        .book-meta { margin: 0 0 8px 0; font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .format-badge { color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 10px; }
        .badge-epub { background-color: #16a34a; }
        .badge-pdf { background-color: #dc2626; }
        .badge-mobi { background-color: #0284c7; }
        .badge-cbr { background-color: #9333ea; }

        .book-review { margin: 0 0 12px 0; color: #334155; font-size: 13px; line-height: 1.45; text-align: justify; max-height: 80px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

        .card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .btn-group { display: flex; gap: 6px; }

        .read-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            -webkit-appearance: none;
        }
        .read-btn:hover { background-color: var(--accent-hover); }

        .drive-icon-btn {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #cbd5e1;
            padding: 7px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .status-select {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #334155;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 8px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .fav-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #cbd5e1;
            padding: 0 4px;
        }
        .fav-btn.is-fav { color: var(--accent-gold); }

        .mosaic-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            aspect-ratio: 1 / 1.5;
            display: flex;
            flex-direction: column;
        }
        .mosaic-card .cover-container { width: 100%; height: 100%; border-radius: 0; }
        .mosaic-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.4) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            box-sizing: border-box;
            color: white;
        }
        .mosaic-title { font-size: 12px; font-weight: bold; line-height: 1.2; margin-bottom: 4px; }
        .mosaic-author { font-size: 10px; color: var(--accent-gold); }

        .pagination-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 35px 0;
        }
        .page-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            -webkit-appearance: none;
        }
        .page-btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        .page-info {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            background-color: var(--header-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }

        .reader-modal-content {
            background: #0f172a;
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .reader-header {
            padding: 12px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .reader-title { font-size: 15px; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .close-btn { background: #dc2626; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }

        .reader-body { flex: 1; position: relative; background: #ffffff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #epub-viewer { width: 100%; height: 100%; background: #ffffff; }

        .reader-footer {
            padding: 10px 20px;
            background: #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .random-modal-content {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--header-bg);
            color: white;
            border: 1px solid var(--border-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 10;
            -webkit-appearance: none;
        }

        @media (max-width: 900px) { .library-grid-detail { grid-template-columns: 1fr; } }
        @media (max-width: 600px) {
            .book-card { flex-direction: column; align-items: center; text-align: center; }
            .book-title { padding-right: 0; }
            .search-bar-wrap { flex-direction: column; }
        }
    </style>
</head>
<body>

<!-- PANTALLA DE ACCESO -->
<div id="login-overlay">
    <div class="login-card">
        <h2>🔒 Acceso Restringido</h2>
        <p>Biblioteca de Faraon138</p>
        <form id="login-form" onsubmit="event.preventDefault(); processLogin(); return false;">
            <input type="text" id="login-user" class="login-input" placeholder="Usuario" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" required>
            <input type="password" id="login-pass" class="login-input" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="button" class="login-btn" onclick="processLogin()">Entrar</button>
            <div id="login-error" class="login-error">Credenciales incorrectas</div>
        </form>
    </div>
</div>

<div class="container" id="main-container">
    <div class="header">
        <h1>★ Biblioteca de Faraon138 ★</h1>
        <p id="catalog-status">Conectando con Google Drive...</p>
        
        <div class="header-actions">
            <button class="action-btn" onclick="forceReSync()">🔄 Recargar</button>
            <button class="action-btn" onclick="openRandomBook()">🎲 Sorpréndeme</button>
            <button class="action-btn" onclick="toggleStatsPanel()">📊 Estadísticas</button>
            <button class="action-btn" onclick="toggleViewMode()" id="view-mode-btn">🧩 Vista Mosaico</button>
            <button class="action-btn" style="background:#b91c1c;" onclick="handleLogout()">🚪 Salir</button>
        </div>
    </div>

    <div id="statsPanel" class="stats-panel">
        <div class="stats-card">
            <h4>Total Catálogo</h4>
            <div id="stat-total">0 libros</div>
        </div>
        <div class="stats-card">
            <h4>Formatos</h4>
            <div id="stat-formats">-</div>
        </div>
        <div class="stats-card">
            <h4>Top Autores</h4>
            <div id="stat-authors" style="font-size: 12px; font-weight: normal; line-height: 1.3;">-</div>
        </div>
    </div>

    <div class="controls-container">
        <div class="search-bar-wrap">
            <input type="text" id="searchBar" class="search-bar" placeholder="Buscar por título, autor o género..." onkeyup="triggerSearch()">
            <select id="sortSelect" class="sort-select" onchange="triggerSort()">
                <option value="recent">Más recientes primero</option>
                <option value="title_asc">Título (A-Z)</option>
                <option value="title_desc">Título (Z-A)</option>
                <option value="author_asc">Autor (A-Z)</option>
                <option value="author_desc">Autor (Z-A)</option>
                <option value="format">Por Formato</option>
            </select>
        </div>
        
        <div class="filter-container">
            <button class="filter-btn active" id="btn-fmt-all" onclick="setFormatFilter('ALL')">Todos</button>
            <button class="filter-btn" id="btn-fmt-epub" onclick="setFormatFilter('EPUB')">EPUB</button>
            <button class="filter-btn" id="btn-fmt-pdf" onclick="setFormatFilter('PDF')">PDF</button>
            <button class="filter-btn" id="btn-fmt-mobi" onclick="setFormatFilter('MOBI')">MOBI</button>
            <button class="filter-btn" id="btn-fmt-cbr" onclick="setFormatFilter('CBR/CBZ')">CBR/CBZ</button>
            <span style="color:#64748b;">|</span>
            <button class="filter-btn" id="filter-favs" onclick="setStatusFilter('FAV')">★ Favoritos</button>
            <button class="filter-btn" id="filter-reading" onclick="setStatusFilter('leyendo')">📖 Leyendo</button>
            <button class="filter-btn" id="filter-read" onclick="setStatusFilter('leido')">✔ Leídos</button>
            <button class="filter-btn" id="filter-pending" onclick="setStatusFilter('pendiente')">⏳ Pendientes</button>
        </div>
    </div>

    <div id="library" class="library-grid-detail"></div>
    <div id="pagination" class="pagination-container"></div>
</div>

<!-- MODAL VISOR EPUB -->
<div id="readerModal" class="modal-overlay">
    <div class="reader-modal-content">
        <div class="reader-header">
            <div class="reader-title" id="reader-book-title">Leyendo...</div>
            <button class="close-btn" onclick="closeReader()">✕ Cerrar Lector</button>
        </div>
        <div class="reader-body">
            <div id="epub-viewer" style="display:none;"></div>
            <div id="reader-loading" style="color:#0f172a; font-size:15px; font-weight:bold; text-align:center; padding:20px;">Cargando e-book digital...</div>
        </div>
        <div class="reader-footer">
            <button class="action-btn" id="epub-prev" onclick="prevEpubPage()" style="display:none;">← Anterior</button>
            <span style="font-size:11px; color:#94a3b8;">Visor EPUB Integrado</span>
            <button class="action-btn" id="epub-next" onclick="nextEpubPage()" style="display:none;">Siguiente →</button>
        </div>
    </div>
</div>

<!-- MODAL SORPRÉNDEME -->
<div id="randomModal" class="modal-overlay">
    <div class="random-modal-content">
        <h3 style="color:var(--accent-gold); margin-top:0;">🎲 ¡Lectura Recomendada!</h3>
        <div id="random-card-body"></div>
        <div style="margin-top: 20px; display:flex; gap:10px; justify-content:center;">
            <button class="action-btn" onclick="openRandomBook()">🎲 Probar con otro</button>
            <button class="close-btn" onclick="closeRandomModal()">Cerrar</button>
        </div>
    </div>
</div>

<button id="backToTop" class="back-to-top" onclick="scrollToTop()">↑</button>

<script>
    // ==========================================
    // CAPA DE ALMACENAMIENTO SEGURO (SAFE STORAGE)
    // ==========================================
    var memoryStore = {};

    function safeGet(key, isSession) {
        try {
            var storage = isSession ? window.sessionStorage : window.localStorage;
            if (storage) return storage.getItem(key);
        } catch (e) {}
        return memoryStore[key] || null;
    }

    function safeSet(key, value, isSession) {
        try {
            var storage = isSession ? window.sessionStorage : window.localStorage;
            if (storage) {
                storage.setItem(key, value);
                return;
            }
        } catch (e) {}
        memoryStore[key] = value;
    }

    function safeRemove(key, isSession) {
        try {
            var storage = isSession ? window.sessionStorage : window.localStorage;
            if (storage) storage.removeItem(key);
        } catch (e) {}
        delete memoryStore[key];
    }

    // ==========================================
    // CONFIGURACIÓN DE SEGURIDAD (MULTI-USUARIO)
    // ==========================================
    var USERS = {
        'faraon138': '12345',      
        'invitado': 'clave123',     
        'familiar': 'lectura2026'   
    };

    var AUTH_SESSION_KEY = 'faraon138_logged_in_v11';
    var AUTH_CURRENT_USER = 'faraon138_current_user_v11';

    function checkAuth() {
        if (safeGet(AUTH_SESSION_KEY, true) === 'true') {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            initLibrary();
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('main-container').style.display = 'none';
        }
    }

    function processLogin() {
        var userEl = document.getElementById('login-user');
        var passEl = document.getElementById('login-pass');
        var errorEl = document.getElementById('login-error');

        if (!userEl || !passEl) return;

        var rawUser = userEl.value || '';
        var rawPass = passEl.value || '';

        var user = rawUser.trim().toLowerCase(); // Ignora mayúsculas en el usuario
        var pass = rawPass.trim();

        if (USERS[user] && USERS[user] === pass) {
            safeSet(AUTH_SESSION_KEY, 'true', true);
            safeSet(AUTH_CURRENT_USER, user, true);
            if (errorEl) errorEl.style.display = 'none';
            
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            initLibrary();
        } else {
            if (errorEl) {
                errorEl.innerText = "Usuario o contraseña incorrectos";
                errorEl.style.display = 'block';
            }
        }
    }

    function normalizeText(text) {
        return (text || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function stringToColor(str) {
        var hash = 0;
        for (var i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
        var c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
        return "#" + "000000".substring(0, 6 - c.length) + c;
    }

    function createPlaceholderCoverHTML(title, author) {
        var bg1 = stringToColor(author || "Anon");

        return '<div class="placeholder-cover" style="background: linear-gradient(135deg, ' + bg1 + ', ' + bg2 + ');">' +
               '<div class="placeholder-author">' + (author || 'Autor Desconocido') + '</div>' +
               '<div class="placeholder-initials">' + initials + '</div>' +
               '<div class="placeholder-title">' + title + '</div>' +

    async function fetchCalibreLibraryFromDrive() {
        var statusPara = document.getElementById('catalog-status');
        
        try {
            var allAuthors = [];
            var authorsPageToken = '';
            
            do {
                var authorsUrl = 'https://www.googleapis.com/drive/v3/files?q=\'' + FOLDER_ID + '\'+in+parents+and+mimeType=\'application/vnd.google-apps.folder\'+and+explicitlyTrashed=false&key=' + API_KEY + '&fields=nextPageToken,files(id,name)&pageSize=1000' + (authorsPageToken ? '&pageToken=' + authorsPageToken : '');
                var authorsResponse = await fetch(authorsUrl);
                var authorsData = await authorsResponse.json();
                
                if (authorsData.files) allAuthors = allAuthors.concat(authorsData.files);
                authorsPageToken = authorsData.nextPageToken;
            } while (authorsPageToken);
            
            for (var i = 0; i < allAuthors.length; i++) {
                var authorFolder = allAuthors[i];
                var booksPageToken = '';
                do {
                    var booksUrl = 'https://www.googleapis.com/drive/v3/files?q=\'' + authorFolder.id + '\'+in+parents+and+mimeType=\'application/vnd.google-apps.folder\'+and+explicitlyTrashed=false&key=' + API_KEY + '&fields=nextPageToken,files(id,name,createdTime)&pageSize=1000' + (booksPageToken ? '&pageToken=' + booksPageToken : '');
                    var booksResponse = await fetch(booksUrl);
                    var booksData = await booksResponse.json();
                    
                    if (booksData.files) {
                        booksData.files.forEach(function(bookFolder) {
                            var bookTitle = bookFolder.name.replace(/\s*\(\d+\)\s*$/, '').trim();
                            var addedTime = bookFolder.createdTime ? new Date(bookFolder.createdTime).getTime() : 0;

                            globalBooks.push({
                                folderId: bookFolder.id,
                                folderName: bookFolder.name,
                                title: bookTitle,
                                author: authorFolder.name,
                                createdTime: addedTime,
                                webViewLink: bookFolder.webViewLink,
                                loadedDetails: false,
                                formats: ['EPUB'] 
                            });
                        });

                        statusPara.innerText = 'Descubriendo libros... (' + globalBooks.length + ' detectados)';

                        if (!firstRenderDone && globalBooks.length > 0) {
                            firstRenderDone = true;
                            filterAndRender(false);
                        } else {
                            requestThrottledRender();
                        }
                    }
                    booksPageToken = booksData.nextPageToken;
                } while (booksPageToken);
            }

            statusPara.innerText = 'Catálogo completo sincronizado (' + globalBooks.length + ' libros disponibles)';
            safeSet(CACHE_KEY, JSON.stringify(globalBooks));
            updateStats();
            filterAndRender(false);

        } catch (error) {
            console.error(error);
            statusPara.innerText = "Error parcial cargando datos de la nube.";
        }
    }

        document.getElementById('stat-total').innerText = globalBooks.length + ' volúmenes';
        
        var counts = { EPUB: 0, PDF: 0, MOBI: 0, Otros: 0 };
        var authorMap = {};

        globalBooks.forEach(function(b) {
            var fmt = (b.formats && b.formats[0]) ? b.formats[0].toUpperCase() : 'EPUB';

        });

        document.getElementById('stat-formats').innerText = counts.EPUB + ' EPUB · ' + counts.PDF + ' PDF · ' + counts.MOBI + ' MOBI';

        var topAuthors = Object.entries(authorMap)
            .sort(function(a,b) { return b[1] - a[1]; })

            .map(function(item) { return '• ' + item[0] + ' (' + item[1] + ')'; })
            .join('<br>');

    function filterAndRender(isBackground) {
        var libraryContainer = document.getElementById('library');
        var cleanQuery = normalizeText(searchQuery).trim();
        var keywords = cleanQuery ? cleanQuery.split(/\s+/).filter(function(k) { return k.length > 0; }) : [];

        var sorted = globalBooks.slice();
        sorted.sort(function(a, b) {
            if (currentSort === 'recent') return b.createdTime - a.createdTime;
            if (currentSort === 'title_asc') return a.title.localeCompare(b.title);
            if (currentSort === 'title_desc') return b.title.localeCompare(a.title);
            if (currentSort === 'author_asc') return a.author.localeCompare(b.author);
            if (currentSort === 'author_desc') return b.author.localeCompare(a.author);
            if (currentSort === 'format') return (a.formats[0]||'').localeCompare(b.formats[0]||'');
            return 0;
        });

        var filtered = sorted.filter(function(book) {
            if (currentFormatFilter !== 'ALL' && book.loadedDetails) {
                if (!book.formats.includes(currentFormatFilter)) return false;
            }
            if (currentStatusFilter === 'FAV' && !userData.favorites[book.folderId]) return false;
            if (['leyendo', 'leido', 'pendiente'].includes(currentStatusFilter)) {
                if (userData.status[book.folderId] !== currentStatusFilter) return false;
            }
            if (keywords.length > 0) {
                var combinedText = normalizeText(book.title + ' ' + book.author + ' ' + book.folderName);
                return keywords.every(function(keyword) { return combinedText.includes(keyword); });
            }
            return true;
        });

        var totalPages = Math.max(1, Math.ceil(filtered.length / itemsPerPage));
        if (currentPage > totalPages) currentPage = totalPages;

        var startIndex = (currentPage - 1) * itemsPerPage;
        var pageItems = filtered.slice(startIndex, startIndex + itemsPerPage);

        var currentDisplayedCards = libraryContainer.querySelectorAll('.book-card, .mosaic-card').length;
        if (isBackground && currentDisplayedCards === pageItems.length) {
            renderPaginationControls(filtered.length);
            updateStats();
            return;
        }

        libraryContainer.className = currentViewMode === 'detail' ? 'library-grid-detail' : 'library-grid-mosaic';
        libraryContainer.innerHTML = '';

        if (filtered.length === 0) {
            libraryContainer.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">No se encontraron libros.</div>';
            renderPaginationControls(0);
            return;
        }

        pageItems.forEach(function(book, index) {
            var absoluteNumber = startIndex + index + 1;
            var isFav = !!userData.favorites[book.folderId];
            var currentStat = userData.status[book.folderId] || 'pendiente';

            if (currentViewMode === 'detail') {
                var card = document.createElement('div');
                card.className = 'book-card';
                card.id = 'card-' + book.folderId;
                
                var coverHTML = book.coverId 
                    ? '<img class="book-cover" src="https://drive.google.com/thumbnail?id=' + book.coverId + '&sz=w500" alt="Portada" loading="lazy">'
                    : createPlaceholderCoverHTML(book.title, book.author);

                var badgesHtml = (book.formats || ['EPUB']).map(function(fmt) {
                    var cls = fmt.toLowerCase().includes('pdf') ? 'badge-pdf' : fmt.toLowerCase().includes('mobi') ? 'badge-mobi' : fmt.toLowerCase().includes('cbr') ? 'badge-cbr' : 'badge-epub';
                    return '<span class="format-badge ' + cls + '">' + fmt + '</span>';
                }).join('');

                card.innerHTML = 
                    '<div class="cover-container" id="cover-zone-' + book.folderId + '">' + coverHTML + '</div>' +
                    '<div class="book-info">' +
                        '<div>' +
                            '<div class="title-header">' +
                                '<h2 class="book-title" id="title-' + book.folderId + '">' + book.title + '</h2>' +
                                '<div class="book-counter">#' + absoluteNumber + '</div>' +
                            '</div>' +
                            '<p class="book-author" id="author-' + book.folderId + '" onclick="filterByAuthor(\'' + book.author.replace(/'/g, "\\'") + '\')">' + book.author + '</p>' +
                            '<div class="book-meta">' +
                                '<span id="formats-zone-' + book.folderId + '">' + badgesHtml + '</span>' +
                            '</div>' +
                            '<div class="book-review" id="review-' + book.folderId + '">' + (book.review || 'Buscando sinopsis en la nube...') + '</div>' +
                        '</div>' +
                        '<div class="card-actions">' +
                            '<div class="btn-group">' +
                                '<button class="read-btn" onclick="openReader(\'' + book.folderId + '\')">📖 Leer</button>' +
                                '<a href="' + (book.bookLink || book.webViewLink) + '" id="link-' + book.folderId + '" class="drive-icon-btn" target="_blank" title="Abrir en Google Drive">📂 Drive</a>' +
                            '</div>' +
                            '<div style="display:flex; align-items:center; gap:6px;">' +
                                '<select class="status-select" onchange="changeBookStatus(\'' + book.folderId + '\', this.value)">' +
                                    '<option value="pendiente" ' + (currentStat==='pendiente'?'selected':'') + '>⏳ Pendiente</option>' +
                                    '<option value="leyendo" ' + (currentStat==='leyendo'?'selected':'') + '>📖 Leyendo</option>' +
                                    '<option value="leido" ' + (currentStat==='leido'?'selected':'') + '>✔ Leído</option>' +

                    ? '<img class="book-cover" src="https://drive.google.com/thumbnail?id=' + book.coverId + '&sz=w500" alt="Portada" loading="lazy">'
                    : createPlaceholderCoverHTML(book.title, book.author);

                    '<div class="cover-container" id="cover-zone-' + book.folderId + '">' + coverHTML + '</div>' +

            if (!book.loadedDetails) {
                fetchBookDeepDetails(book);

        renderPaginationControls(filtered.length);
        updateStats();
    }

    async function fetchBookDeepDetails(book) {
        try {
            var filesUrl = 'https://www.googleapis.com/drive/v3/files?q=\'' + book.folderId + '\'+in+parents+and+explicitlyTrashed=false&key=' + API_KEY + '&fields=files(id,name,webViewLink)&pageSize=100';
            var filesResponse = await fetch(filesUrl);
            var filesData = await filesResponse.json();

            var metadataId = '';
            var coverId = '';
            var fileToReadId = '';
            var bookLink = book.webViewLink; 
            var detectedFormats = [];

            if (filesData.files) {
                filesData.files.forEach(function(file) {
                    var nameLower = file.name.toLowerCase();
                    if (nameLower === 'metadata.opf') metadataId = file.id;
                    else if (nameLower.includes('cover.')) coverId = file.id;
                    
                    if (nameLower.endsWith('.epub')) { detectedFormats.push('EPUB'); fileToReadId = file.id; bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.pdf')) { detectedFormats.push('PDF'); bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.mobi')) { detectedFormats.push('MOBI'); if(!fileToReadId) fileToReadId = file.id; bookLink = file.webViewLink; }
                    else if (nameLower.endsWith('.cbr') || nameLower.endsWith('.cbz')) { detectedFormats.push('CBR/CBZ'); bookLink = file.webViewLink; }
                });
            }

            book.coverId = coverId;
            book.fileToReadId = fileToReadId;
            book.bookLink = bookLink;
            if (detectedFormats.length > 0) book.formats = detectedFormats;
            book.loadedDetails = true;

            var coverZone = document.getElementById('cover-zone-' + book.folderId);
            if (coverZone && coverId) {
                coverZone.innerHTML = '<img class="book-cover" src="https://drive.google.com/thumbnail?id=' + coverId + '&sz=w500" alt="Portada" loading="lazy">';
            }
            var formatsZone = document.getElementById('formats-zone-' + book.folderId);
            if (formatsZone) {
                var badgesHtml = book.formats.map(function(fmt) {
                    var cls = fmt.toLowerCase().includes('pdf') ? 'badge-pdf' : fmt.toLowerCase().includes('mobi') ? 'badge-mobi' : fmt.toLowerCase().includes('cbr') ? 'badge-cbr' : 'badge-epub';
                    return '<span class="format-badge ' + cls + '">' + fmt + '</span>';
                }).join('');
                formatsZone.innerHTML = badgesHtml;
            }
            var linkEl = document.getElementById('link-' + book.folderId);
            if (linkEl) linkEl.setAttribute('href', bookLink);

            if (metadataId) {
                var googleUrl = 'https://www.googleapis.com/drive/v3/files/' + metadataId + '?alt=media&key=' + API_KEY;
                var xmlText = null;
                var proxies = [
                    'https://api.allorigins.win/raw?url=' + encodeURIComponent(googleUrl),
                    'https://corsproxy.io/?' + encodeURIComponent(googleUrl)
                ];

                for (var p = 0; p < proxies.length; p++) {
                    try {
                        var res = await fetch(proxies[p]);
                        if (res.ok) {
                            xmlText = await res.text();
                            if (xmlText && xmlText.includes('<')) break;
                        }
                    } catch(e) {}
                }

                if (xmlText) {
                    var parser = new DOMParser();
                    var xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    
                    var titleNode = xmlDoc.getElementsByTagName("dc:title")[0] || xmlDoc.getElementsByTagName("title")[0];
                    var creatorNode = xmlDoc.getElementsByTagName("dc:creator")[0] || xmlDoc.getElementsByTagName("creator")[0];
                    var descNode = xmlDoc.getElementsByTagName("dc:description")[0] || xmlDoc.getElementsByTagName("description")[0];

                    if (titleNode && titleNode.textContent) {
                        book.title = titleNode.textContent.trim();
                        var tEl = document.getElementById('title-' + book.folderId);
                        if (tEl) tEl.innerText = book.title;
                    }
                    if (creatorNode && creatorNode.textContent) {
                        book.author = creatorNode.textContent.trim();
                        var aEl = document.getElementById('author-' + book.folderId);
                        if (aEl) aEl.innerText = book.author;
                    }
                    if (descNode && descNode.textContent) {
                        book.review = descNode.textContent.trim();
                        var rEl = document.getElementById('review-' + book.folderId);
                        if (rEl) rEl.innerHTML = book.review;
                    }
                }
            }

            safeSet(CACHE_KEY, JSON.stringify(globalBooks));

        } catch (err) {}
    }

    async function openReader(folderId) {
        var book = globalBooks.find(function(b) { return b.folderId === folderId; });
        if (!book) return;

        if (book.formats && book.formats.some(function(f) { return f.toUpperCase().includes('PDF'); })) {
            window.open(book.bookLink || book.webViewLink, '_blank');
            return;
        }

        var modal = document.getElementById('readerModal');
        var titleEl = document.getElementById('reader-book-title');
        var loadingEl = document.getElementById('reader-loading');
        var epubViewer = document.getElementById('epub-viewer');

        titleEl.innerText = 'Leyendo: ' + book.title;
        modal.classList.add('active');
        loadingEl.style.display = 'block';
        loadingEl.innerHTML = "Descargando e-book y preparando visor...";
        epubViewer.style.display = 'none';

        document.getElementById('epub-prev').style.display = 'none';
        document.getElementById('epub-next').style.display = 'none';

        if (!book.fileToReadId) {
            loadingEl.innerHTML = 'No se detectó un archivo legible directo.<br><br><a href="' + (book.bookLink || book.webViewLink) + '" target="_blank" class="read-btn">📂 Abrir en Google Drive</a>';
            return;
        }

        try {
            var directUrl = 'https://www.googleapis.com/drive/v3/files/' + book.fileToReadId + '?alt=media&key=' + API_KEY;
            var response = await fetch(directUrl);
            
            if (!response.ok) throw new Error("Error en la respuesta de Drive API");
            
            var arrayBuffer = await response.arrayBuffer();

            loadingEl.style.display = 'none';
            epubViewer.style.display = 'block';
            document.getElementById('epub-prev').style.display = 'inline-block';
            document.getElementById('epub-next').style.display = 'inline-block';

            if (epubRendition) {
                try { epubRendition.destroy(); } catch(e){}
            }
            epubViewer.innerHTML = '';

            var ePubBook = ePub(arrayBuffer);
            epubRendition = ePubBook.renderTo("epub-viewer", { width: "100%", height: "100%" });
            await epubRendition.display();

        } catch (e) {
            console.error("Error abriendo EPUB:", e);
            loadingEl.style.display = 'block';
            loadingEl.innerHTML = 'No se pudo desplegar el visor interno de este e-book.<br><br><a href="' + (book.bookLink || book.webViewLink) + '" target="_blank" class="read-btn" style="text-decoration:none;">📂 Abrir directamente en Google Drive</a>';
        }
    }

        if (epubRendition && typeof epubRendition.prev === 'function') {

        }
    }

    function nextEpubPage() {
        if (epubRendition && typeof epubRendition.next === 'function') {

    }

    function closeReader() {
        document.getElementById('readerModal').classList.remove('active');
        if (epubRendition) {

        }
    }

    document.addEventListener('keydown', function(e) {
        var modal = document.getElementById('readerModal');
        if (modal.classList.contains('active') && epubRendition) {
            if (e.key === 'ArrowRight') nextEpubPage();
            if (e.key === 'ArrowLeft') prevEpubPage();
            if (e.key === 'Escape') closeReader();
        }
    });

    }

    function setStatusFilter(status) {
        currentStatusFilter = currentStatusFilter === status ? 'ALL' : status;
        var statusMap = {
            'FAV': 'filter-favs',
            'leyendo': 'filter-reading',
            'leido': 'filter-read',
            'pendiente': 'filter-pending'
        };
        Object.values(statusMap).forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.classList.remove('active-status');
        });
        if (currentStatusFilter !== 'ALL' && statusMap[currentStatusFilter]) {
            var activeEl = document.getElementById(statusMap[currentStatusFilter]);
            if (activeEl) activeEl.classList.add('active-status');
        }
        currentPage = 1;
        filterAndRender(false);
    }

    function toggleViewMode() {
        currentViewMode = currentViewMode === 'detail' ? 'mosaic' : 'detail';
        document.getElementById('view-mode-btn').innerText = currentViewMode === 'detail' ? '🧩 Vista Mosaico' : '📋 Vista Detalle';
        filterAndRender(false);
    }

    function triggerSearch() {
        searchQuery = document.getElementById('searchBar').value;
        currentPage = 1;
        filterAndRender(false);
    }

    function triggerSort() {
        currentSort = document.getElementById('sortSelect').value;
        filterAndRender(false);
    }

    function renderPaginationControls(totalItems) {
        var pagContainer = document.getElementById('pagination');
        var totalPages = Math.max(1, Math.ceil(totalItems / itemsPerPage));
        
        if (totalPages <= 1) { pagContainer.innerHTML = ''; return; }

        pagContainer.innerHTML = 
            '<button class="page-btn" ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="changePage(-1)">← Anteriores 50</button>' +
            '<span class="page-info">Página ' + currentPage + ' de ' + totalPages + '</span>' +
            '<button class="page-btn" ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="changePage(1)">Siguientes 50 →</button>';
    }

    function changePage(dir) {
        currentPage += dir;
        window.scrollTo({top: 0, behavior: 'smooth'});
        filterAndRender(false);
    }

    window.onscroll = function() {
        var btn = document.getElementById("backToTop");
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            btn.style.display = "block";
        } else {
            btn.style.display = "none";
        }
    };

    function scrollToTop() { window.scrollTo({top: 0, behavior: 'smooth'}); }

    // INICIAR CON CONTROL DE ACCESO
    checkAuth();
</script>

</body>
</html>
